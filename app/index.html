<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello CI/CD</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        background: #0f172a;
        color: #e2e8f0;

      .card {
        text-align: center;
        padding: 2rem 3rem;
        border-radius: 12px;
        background: #1e293b;
      }
      h1 {
        margin: 0 0 0.5rem;
      }

      }

  <body>
    <div class="card">
      <h1>Hello, World 2026! 👋</h1>
      <p>Deployed with GitHub Actions + Docker + AWS EC2</p>
      <p>Version: <code>__VERSION__</code></p>

  </body>
</html>
