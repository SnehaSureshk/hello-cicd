name: Build and Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you run it manually from the Actions tab

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/hello-cicd

jobs:
  build:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Pull and restart container over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ env.IMAGE }}:${{ github.sha }}
            docker rm -f hello-cicd || true
            docker run -d --name hello-cicd -p 80:80 --restart unless-stopped \
              ${{ env.IMAGE }}:${{ github.sha }}
            docker image prune -af

      - name: Smoke test
        run: |
          sleep 5
          curl -fsS http://${{ secrets.EC2_HOST }} | grep "${{ github.sha }}"
          echo "✅ Version ${{ github.sha }} is live at http://${{ secrets.EC2_HOST }}"
